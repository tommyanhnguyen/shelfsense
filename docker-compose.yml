x-service-environment: &service-environment
  MQTT_URL: mqtt://broker:1883
  MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/shelfsense}
  MQTT_USERNAME: ${MQTT_USERNAME:-}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-}
  EVENT_SIGNING_REQUIRED: ${EVENT_SIGNING_REQUIRED:-false}
  EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  broker:
    build: .
    command: node src/broker.js
    restart: unless-stopped
    environment:
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(1883,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  node-red:
    image: nodered/node-red:4.0.9
    command: node /data/start.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      EVENT_SIGNING_REQUIRED: ${EVENT_SIGNING_REQUIRED:-false}
      EVENT_SIGNING_SECRET: ${EVENT_SIGNING_SECRET:-}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:-}
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./node-red/settings.js:/data/settings.js:ro
      - ./node-red/start.js:/data/start.js:ro
      - ./node-red/flows.json:/data/flows.json:ro
      - ./node-red/edge.js:/data/edge.js:ro
      - ./src/shared:/src/shared:ro

  inventory:
    build: .
    command: node src/service.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: inventory

  replenishment:
    build: .
    command: node src/service.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: replenishment

  cold-chain:
    build: .
    command: node src/service.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: cold-chain

  delivery:
    build: .
    command: node src/service.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: delivery

  dead-letter:
    build: .
    command: node src/service.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: dead-letter

  api:
    build: .
    command: node src/api.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      PORT: 3000
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-false}
      API_AUTH_SECRET: ${API_AUTH_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"

  simulator:
    build: .
    command: node src/workload.js demo
    profiles: ["demo"]
    depends_on:
      node-red:
        condition: service_started
    environment:
      MQTT_URL: mqtt://broker:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      STORES: 2
      STARTUP_DELAY_MS: 8000

  load:
    build: .
    command: node src/workload.js
    profiles: ["load"]
    depends_on:
      node-red:
        condition: service_started
    environment:
      MQTT_URL: mqtt://broker:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      RATE: ${RATE:-100}
      DURATION: ${DURATION:-60}
      STORES: ${STORES:-20}
      SHELVES_PER_STORE: ${SHELVES_PER_STORE:-50}
      RUN_ID: ${RUN_ID:-}

volumes:
  mongo-data:
